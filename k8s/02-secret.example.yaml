# TEMPLATE — do not apply this file as-is and do not commit real secrets
# into it. Two safe ways to actually populate this:
#
#   1. Copy this file to 02-secret.yaml (already gitignored), fill in real
#      values, `kubectl apply -f 02-secret.yaml`, then delete the local copy.
#   2. Skip this file entirely and create the secret imperatively, which
#      never writes secrets to disk in the repo at all:
#
#      kubectl create secret generic lesson-teacher-secrets \
#        --namespace lesson-teacher \
#        --from-literal=DATABASE_URL='postgres://user:pass@host:5432/lessonteacher' \
#        --from-literal=JWT_ACCESS_SECRET='...' \
#        --from-literal=JWT_REFRESH_SECRET='...' \
#        --from-literal=PAYSTACK_SECRET_KEY='...' \
#        --from-literal=CLOUDINARY_CLOUD_NAME='...' \
#        --from-literal=CLOUDINARY_API_KEY='...' \
#        --from-literal=CLOUDINARY_API_SECRET='...'
#
# In a real production setup, prefer an external secrets manager (Sealed
# Secrets, External Secrets Operator, or your cloud provider's own) over
# either of the above — both still involve the plaintext value touching
# your local shell/disk at some point.
apiVersion: v1
kind: Secret
metadata:
  name: lesson-teacher-secrets
  namespace: lesson-teacher
type: Opaque
stringData:
  DATABASE_URL: 'postgres://REPLACE_ME:REPLACE_ME@REPLACE_ME:5432/lessonteacher'
  # Only needed if you're applying 03-postgres.yaml (in-cluster Postgres for
  # dev/staging). Must match the password half of DATABASE_URL above.
  POSTGRES_PASSWORD: 'REPLACE_ME'
  JWT_ACCESS_SECRET: 'REPLACE_ME'
  JWT_REFRESH_SECRET: 'REPLACE_ME'
  PAYSTACK_SECRET_KEY: 'REPLACE_ME'
  CLOUDINARY_CLOUD_NAME: 'REPLACE_ME'
  CLOUDINARY_API_KEY: 'REPLACE_ME'
  CLOUDINARY_API_SECRET: 'REPLACE_ME'
