server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite's hashed build assets (index-<hash>.js/css) are safe to cache
    # forever — a new deploy ships new filenames, so there's no staleness
    # risk. index.html itself must never be cached, or a deploy won't be
    # visible to returning users until their cache expires.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The app uses a HashRouter, so in practice only "/" is ever requested
    # from the server (routes live after the "#"). This fallback still
    # matters for any direct path someone types or bookmarks outside the
    # hash, and costs nothing to leave in.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
